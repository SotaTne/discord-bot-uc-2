# Google Apps Script（apps/cron。毎分、Worker の POST /cron を呼ぶ）のデプロイ。
# Apps Script は、ステージングと本番で共通の 1 つだけなので、develop / main の CD（cd.yml）とは、別に動かす。
# 動くとき: main の apps/cron か packages/cron が変わったとき / Actions の画面から手動で。
#
# 順序: ci → 存在の確認 → 置く（push）→ ウェブアプリを更新（redeploy）→ 毎分のトリガーがあることを保証する
# 設定は、GitHub の Environment「gas」に置く（Deployment branches は main だけにする）。値の取り方は、apps/cron/README.md
name: gas-cd

on:
  push:
    branches: [main,develop]
    paths:
      - apps/cron/**
      - packages/cron/**
      - .github/workflows/gas-cd.yml
  workflow_dispatch:

concurrency:
  group: gas-cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # main 以外（手動実行で、別のブランチを選んだとき）は、置かない
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: gas
    env:
      # ~/.clasprc.json の中身（Google へのログイン情報。秘密）
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      # Worker の CRON_SECRET と同じ値（ウェブアプリの合言葉。秘密）
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Apps Script のプロジェクトの ID（.clasp.json の scriptId）と、ウェブアプリのデプロイの ID
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
    defaults:
      run:
        working-directory: apps/cron
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        # working-directory は、composite アクションの中には、効かない（ここは、リポジトリのルートで動く）
      - run: pnpm --filter @uc/cron-app build
        working-directory: .

      - name: clasp の設定ファイルを、一時的に作る
        run: |
          for name in CLASPRC_JSON CRON_SECRET GAS_SCRIPT_ID GAS_DEPLOYMENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} が、Environment「gas」に登録されていません（apps/cron/README.md の手順）"
              exit 1
            fi
          done
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"dist"}\n' "$GAS_SCRIPT_ID" > .clasp.json

      # プロジェクトが、なければ（create をしていない・削除した・ID の間違い）、ここで止める。置いても、どこにも届かない
      - name: Apps Script のプロジェクトと、ウェブアプリのデプロイが、あるか確かめる
        run: |
          if ! deployments=$(pnpm exec clasp list-deployments "$GAS_SCRIPT_ID" 2>&1); then
            echo "::error::Apps Script のプロジェクト（${GAS_SCRIPT_ID}）を、開けません。先に create をして、ID を Variable GAS_SCRIPT_ID に登録してください"
            echo "$deployments"
            exit 1
          fi
          if ! grep -q "$GAS_DEPLOYMENT_ID" <<< "$deployments"; then
            echo "::error::デプロイ（${GAS_DEPLOYMENT_ID}）が、見つかりません。先に deployment をして、ID を Variable GAS_DEPLOYMENT_ID に登録してください"
            echo "$deployments"
            exit 1
          fi

      - name: コードを置く
        run: pnpm exec clasp push --force

      # ウェブアプリは、「デプロイしたバージョン」を動かす（置いただけでは、古いまま）。毎分のトリガー（tick）は、置いた最新のコードを使う
      - name: ウェブアプリを、置いたコードに更新する
        run: pnpm exec clasp redeploy "$GAS_DEPLOYMENT_ID" --description "$GITHUB_SHA"

      # 毎分のトリガーが、あることを保証する（なければ作る。あれば作り直す。何度でも、同じ結果）
      - name: 毎分のトリガーを、保証する
        run: |
          body=$(curl --silent --show-error --location --max-time 60 \
            --request POST "https://script.google.com/macros/s/${GAS_DEPLOYMENT_ID}/exec" \
            --data-urlencode "key=${CRON_SECRET}")
          if [ "$body" != "ok" ]; then
            echo "::error::トリガーを保証できませんでした（応答: ${body:0:100}）。最初に、Apps Script の画面で、一度、権限を許可する必要があります"
            exit 1
          fi

      - name: 認証の情報を、消す
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
