# CI（型の確認・テスト・マイグレーションの整合性）。
# - develop・main への PR で動く。この「ci」のチェックを、ブランチ保護で、マージの必須条件にする
# - cd.yml からも呼ばれる（develop・main への push）。通ったときだけ、デプロイに進む
name: ci

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # 型の確認と、すべてのテスト（本番のビルドに、開発専用のコードが入っていないことの確認を含む）
      - run: pnpm check
      # マイグレーションの履歴の整合性（ブランチ間で、番号が衝突していないか、など）
      - run: pnpm --filter @uc/db exec drizzle-kit check
