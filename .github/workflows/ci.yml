# CI。develop・main への PR と、develop・main への push（マージ後）で動く。
# PR の「ci」のチェックを、ブランチ保護で、マージの必須条件にする
# （通っていないものは、マージできない → Cloudflare の Git 連携が、デプロイする対象に、入らない）。
# push（マージ後）の実行は、デプロイを止めない（デプロイは、Cloudflare 側で、並行して動く）。マージされた結果が、そのブランチで、通っているかの確認と、記録のため。
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node と pnpm は、mise.toml のバージョンを使う（手元と同じ）
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # 型の確認と、すべてのテスト（本番のビルドに、開発専用のコードが入っていないことの確認を含む）
      - run: pnpm check
      # マイグレーションの履歴の整合性（ブランチ間で、番号が衝突していないか、など）
      - run: pnpm --filter @uc/db exec drizzle-kit check
