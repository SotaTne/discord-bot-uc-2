# CD。develop に入ったらステージング、main に入ったら本番へ。
# CI が通ったときだけ進む（そのコミットの CI。ブランチ保護の抜け道があっても、止まる）。
# 環境ごとの設定（Cloudflare の API トークン、Discord のトークンなど）は、GitHub の Environments（staging・production）に置く。
#
# 順序: ci → deploy（マイグレーション → Worker）→ register-commands（スラッシュコマンドの登録）
# 登録を、デプロイの「後」にする理由: 先に登録すると、「新しいコマンドが画面に出るのに、古い Worker が処理できない」期間が、できる。
# 後なら、失敗しても、古いコマンドが動き続けるだけ（登録は、独立したジョブなので、そこだけ再実行できる）。
name: cd

# 手動実行（Actions の画面の「Run workflow」）: 選んだブランチで動く。デプロイできるのは、develop と main だけ（それ以外では、CI だけ動いて、デプロイは、飛ばされる）
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# 同じブランチのデプロイは、順番に処理する（途中のデプロイを、止めない）
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # develop と main 以外（手動実行で、別のブランチを選んだとき）は、デプロイしない（そのブランチのコードが、ステージングに出てしまうため）
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    # ブランチから、環境を決める（develop → staging、main → production）
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Worker に渡す値。秘密は、Bot のトークンと、cron の合言葉（公開鍵とアプリの ID は、公開してよい値）
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # ダッシュボードをビルドする（worker が、同じ Worker から、静的ファイルとして配信する）
      - run: pnpm build
      # マイグレーションを、先に適用する。新しい DB で、古いコードが動く形にしておくこと（README の「DB を変えるとき」）
      - run: pnpm --filter @uc/worker exec wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
      # シークレットは、デプロイと一緒に、Cloudflare に渡す（GitHub が、唯一の置き場。Cloudflare に、手動で置かない）。
      # --secrets-file は、足すだけ（消えない）。消すときは、wrangler secret delete
      # 必須の秘密が、登録されていなければ、ここで止まる。任意の秘密は、登録されているときだけ渡す（CRON_SECRET は、未登録の間、/cron が、すべて断る）
      - name: シークレットのファイルを、一時的に作る
        run: >
          .github/scripts/write-secrets.sh "$RUNNER_TEMP/secrets.env"
          --required DISCORD_BOT_TOKEN
          --optional CRON_SECRET
      - run: >
          pnpm --filter @uc/worker exec wrangler deploy --env "$DEPLOY_ENV"
          --secrets-file "$RUNNER_TEMP/secrets.env"
          --var "DISCORD_PUBLIC_KEY:$DISCORD_PUBLIC_KEY"
          --var "DISCORD_APPLICATION_ID:$DISCORD_APPLICATION_ID"
      - name: シークレットのファイルを、消す
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.env"

  # スラッシュコマンドを、Discord に登録する（毎回、全部を、上書きする。何度実行しても、同じ結果）
  register-commands:
    needs: deploy
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      # 指定すると、そのサーバーだけに登録する（すぐに反映される）。ステージング向け。
      # 本番（main）では、変数を設定していても、空にする（全サーバーに登録する）。
      # ※ 式は「main でない && 変数 || 空」の向きに書く。空文字は偽として扱われるので、「main && 空 || 変数」と書くと、main でも変数が返る
      DISCORD_GUILD_ID: ${{ github.ref_name != 'main' && vars.DISCORD_GUILD_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm register-commands
